name: Build Sanzxcy Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create Debug Keystore
        run: |
          if [ ! -f app/persistent-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/persistent-debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleFossRelease
        env:
          METROLIST_APPLICATION_ID: com.sanzxcy.music.com
          METROLIST_APP_NAME: Sanzxcy
          SANZXCY_SERVER_URL: ${{ vars.SANZXCY_SERVER_URL }}
          PULL_REQUEST: "false"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Sanzxcy-Music-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
